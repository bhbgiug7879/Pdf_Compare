<div class="category-page-wrapper" *ngIf="category">
  <div class="category-header-section">
    <div class="category-header-container">
      <div class="breadcrumb-bar">
        <a routerLink="/">Home</a>
        <span>/</span>
        <span class="active">{{ category.name }}</span>
      </div>

      <div class="cat-badge" [style.color]="category.color">
        {{ category.badge || 'Category Suite' }}
      </div>

      <h1 class="cat-title">{{ category.name }} Tools Online</h1>
      <p class="cat-desc">{{ category.description }}</p>
    </div>
  </div>

  <div class="category-tools-section">
    <div class="section-container">
      <div class="tools-grid">
        <a 
          *ngFor="let tool of tools" 
          [routerLink]="['/', tool.slug]" 
          class="tool-card animate-fade-in"
        >
          <div class="card-top">
            <div class="tool-icon-wrapper" [style.background]="tool.iconBg" [style.color]="tool.accentColor">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              </svg>
            </div>
            <span *ngIf="tool.badge" class="tool-badge" [style.color]="tool.accentColor" [style.background]="tool.iconBg">
              {{ tool.badge }}
            </span>
          </div>

          <div class="card-body">
            <h3 class="tool-name">{{ tool.name }}</h3>
            <p class="tool-desc">{{ tool.shortDescription }}</p>
          </div>

          <div class="card-footer">
            <span class="tool-cta-label">Open Tool</span>
            <svg class="arrow-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
