<span class="status-badge" [ngClass]="[statusClass, 'size-' + size]">
  <span *ngIf="showIcon" class="badge-icon" aria-hidden="true">
    <!-- Unchanged Check Icon -->
    <svg *ngIf="status === 'unchanged'" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
    </svg>

    <!-- Changed / Edit Icon -->
    <svg *ngIf="status === 'value_changed' || status === 'changed'" viewBox="0 0 20 20" fill="currentColor">
      <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
    </svg>

    <!-- Added Plus Icon -->
    <svg *ngIf="status === 'added'" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
    </svg>

    <!-- Removed Minus Icon -->
    <svg *ngIf="status === 'removed'" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
    </svg>

    <!-- Label Variation Icon -->
    <svg *ngIf="status === 'label_variation'" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M4 2a2 2 0 00-2 2v11a3 3 0 106 0V4a2 2 0 00-2-2H4zm1 14a1 1 0 100-2 1 1 0 000 2zm5-1.757l4.9-4.9a2 2 0 000-2.828L13.485 5.1a2 2 0 00-2.828 0L10 5.757v8.486zM16 18H9.071l6-6H16a2 2 0 012 2v2a2 2 0 01-2 2z" clip-rule="evenodd" />
    </svg>
  </span>
  <span class="badge-text">{{ label }}</span>
</span>
