<div class="app-shell">
  <!-- Top Global Navigation Bar -->
  <app-navbar
    (openHelp)="openHelp()"
    (openSecurity)="openSecurity()"
    (openPro)="openPro()"
    (openHistory)="openHistory()"
    (openContact)="openContact()"
  ></app-navbar>

  <!-- Routed Main Application View (Home, Category, Tool Pages, Compare) -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Footer -->
  <app-footer></app-footer>

  <!-- Global Overlay Modals -->
  <app-help-modal *ngIf="showHelpModal" (close)="showHelpModal = false"></app-help-modal>
  <app-security-modal *ngIf="showSecurityModal" (close)="showSecurityModal = false"></app-security-modal>
  <app-history-modal *ngIf="showHistoryModal" (close)="showHistoryModal = false"></app-history-modal>
  <app-contact-modal *ngIf="showContactModal" (close)="showContactModal = false"></app-contact-modal>
  <app-pro-modal *ngIf="showProModal" [triggerReason]="proModalReason" (close)="closePro()"></app-pro-modal>
</div>
