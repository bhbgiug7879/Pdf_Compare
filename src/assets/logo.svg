<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="doc1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="doc2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="diffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.32" />
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background App Card -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="100" stroke="white" stroke-width="2" stroke-opacity="0.15" />

  <!-- Document 1: Left / Background (Original) -->
  <g filter="url(#dropShadow)">
    <path d="M120 120 C120 106.7 130.7 96 144 96 H250 L314 160 V376 C314 389.3 303.3 400 290 400 H144 C130.7 400 120 389.3 120 376 Z" fill="url(#doc1Grad)" />
    <!-- Folded Corner -->
    <path d="M250 96 V148 C250 154.6 255.4 160 262 160 H314 Z" fill="#CBD5E1" />
    
    <!-- Skeleton content lines -->
    <rect x="152" y="190" width="124" height="14" rx="7" fill="#94A3B8" fill-opacity="0.55" />
    <rect x="152" y="222" width="100" height="12" rx="6" fill="#94A3B8" fill-opacity="0.45" />
    <rect x="152" y="250" width="115" height="14" rx="7" fill="#F87171" fill-opacity="0.75" />
    <rect x="152" y="280" width="80" height="12" rx="6" fill="#94A3B8" fill-opacity="0.45" />
  </g>

  <!-- Document 2: Right / Foreground (Compared & Diffed) -->
  <g filter="url(#dropShadow)">
    <path d="M198 140 C198 126.7 208.7 116 222 116 H328 L392 180 V396 C392 409.3 381.3 420 368 420 H222 C208.7 420 198 409.3 198 396 Z" fill="url(#doc2Grad)" />
    <!-- Folded Corner -->
    <path d="M328 116 V168 C328 174.6 333.4 180 340 180 H392 Z" fill="#CBD5E1" />

    <!-- Content Lines with Diff Highlight -->
    <rect x="230" y="210" width="124" height="14" rx="7" fill="#64748B" fill-opacity="0.55" />
    <rect x="230" y="242" width="100" height="12" rx="6" fill="#64748B" fill-opacity="0.45" />
    <!-- Value Changed Highlight -->
    <rect x="230" y="270" width="124" height="16" rx="8" fill="#10B981" fill-opacity="0.95" />
    <rect x="230" y="304" width="85" height="12" rx="6" fill="#64748B" fill-opacity="0.45" />
    <rect x="230" y="332" width="110" height="12" rx="6" fill="#64748B" fill-opacity="0.35" />
  </g>

  <!-- Diff Match Success Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="370" cy="370" r="54" fill="url(#diffGrad)" stroke="white" stroke-width="5" />
    <path d="M346 370 L364 388 L396 352" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- AI Intelligence Sparkles -->
  <g fill="url(#goldSpark)">
    <path d="M394 66 Q408 66 408 52 Q408 66 422 66 Q408 66 408 80 Q408 66 394 66 Z" />
    <path d="M106 64 Q116 64 116 54 Q116 64 126 64 Q116 64 116 74 Q116 64 106 64 Z" />
  </g>
</svg>
