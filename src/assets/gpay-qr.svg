<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <rect width="240" height="240" rx="16" fill="#FFFFFF" />
  
  <!-- Outer Finder Pattern Top-Left -->
  <rect x="20" y="20" width="56" height="56" rx="8" fill="#0F172A" />
  <rect x="28" y="28" width="40" height="40" rx="4" fill="#FFFFFF" />
  <rect x="36" y="36" width="24" height="24" rx="2" fill="#4F46E5" />

  <!-- Outer Finder Pattern Top-Right -->
  <rect x="164" y="20" width="56" height="56" rx="8" fill="#0F172A" />
  <rect x="172" y="28" width="40" height="40" rx="4" fill="#FFFFFF" />
  <rect x="180" y="36" width="24" height="24" rx="2" fill="#4F46E5" />

  <!-- Outer Finder Pattern Bottom-Left -->
  <rect x="20" y="164" width="56" height="56" rx="8" fill="#0F172A" />
  <rect x="28" y="172" width="40" height="40" rx="4" fill="#FFFFFF" />
  <rect x="36" y="180" width="24" height="24" rx="2" fill="#4F46E5" />

  <!-- QR Matrix Data Blocks -->
  <g fill="#1E293B">
    <!-- Row 1 -->
    <rect x="88" y="24" width="12" height="12" rx="2" />
    <rect x="112" y="24" width="12" height="12" rx="2" />
    <rect x="136" y="24" width="12" height="12" rx="2" />

    <!-- Row 2 -->
    <rect x="88" y="44" width="20" height="12" rx="2" />
    <rect x="124" y="44" width="12" height="20" rx="2" />
    <rect x="144" y="44" width="12" height="12" rx="2" />

    <!-- Row 3 -->
    <rect x="24" y="88" width="12" height="12" rx="2" />
    <rect x="44" y="88" width="20" height="12" rx="2" />
    <rect x="88" y="80" width="12" height="12" rx="2" />
    <rect x="144" y="80" width="16" height="12" rx="2" />
    <rect x="180" y="88" width="16" height="12" rx="2" />
    <rect x="204" y="88" width="12" height="20" rx="2" />

    <!-- Row 4 -->
    <rect x="24" y="112" width="20" height="12" rx="2" />
    <rect x="52" y="112" width="12" height="20" rx="2" />
    <rect x="176" y="112" width="12" height="12" rx="2" />
    <rect x="196" y="120" width="20" height="12" rx="2" />

    <!-- Row 5 -->
    <rect x="24" y="136" width="12" height="16" rx="2" />
    <rect x="44" y="140" width="24" height="12" rx="2" />
    <rect x="80" y="140" width="16" height="12" rx="2" />
    <rect x="144" y="140" width="20" height="12" rx="2" />
    <rect x="176" y="140" width="12" height="16" rx="2" />

    <!-- Row 6 (Bottom Right area) -->
    <rect x="88" y="176" width="16" height="16" rx="2" />
    <rect x="112" y="164" width="12" height="20" rx="2" />
    <rect x="136" y="164" width="16" height="12" rx="2" />
    <rect x="160" y="176" width="20" height="12" rx="2" />
    <rect x="192" y="164" width="12" height="24" rx="2" />
    <rect x="88" y="200" width="20" height="16" rx="2" />
    <rect x="120" y="196" width="24" height="12" rx="2" />
    <rect x="152" y="200" width="16" height="16" rx="2" />
    <rect x="180" y="200" width="24" height="16" rx="2" />
  </g>

  <!-- Center UPI / GPay Emblem -->
  <rect x="92" y="92" width="56" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  <rect x="98" y="98" width="44" height="44" rx="8" fill="linear-gradient(135deg, #4F46E5 0%, #06B6D4 100%)" />
  <!-- GPay / UPI Text/Logo -->
  <text x="120" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">UPI</text>
</svg>
